name: Android APK Derlemesi

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Kodu Sunucuya Çek
        uses: actions/checkout@v4

      - name: 🟢 Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ☕ Java (JDK 17) Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📥 Bağımlılıkları Yükle (NPM)
        run: |
          npm install
          npx expo install expo-clipboard

      - name: 🚀 APK'yı Derle (Gradle)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: 🔍 APK'yı Garantiye Al (Artifacts Yüklemesi)
        uses: actions/upload-artifact@v4
        with:
          name: ridm-app-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: 🎁 GitHub Releases'e Otomatik Yükle
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
