name: Build and Release APK

# Bu otomasyon sadece v1.0.0 gibi bir etiket (tag) gönderdiğinde çalışır
on:
  push:
    tags:
      - 'v*' 

jobs:
  build:
    name: Android APK Derlemesi
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Kodu Sunucuya Çek
        uses: actions/checkout@v4

      - name: 🟢 Node.js Kurulumu (V18)
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: ☕ Java (JDK 17) Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📥 Bağımlılıkları Yükle (NPM)
        run: npm install

      - name: 🚀 APK'yı Derle (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 🎁 GitHub Releases'e Otomatik Yükle
        uses: softprops/action-gh-release@v1
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          name: Ridm ${{ github.ref_name }}
          body: "Ridm Açık Kaynak Sürümü. Bu sürüm doğrudan GitHub Actions tarafından orijinal kaynak kodlar kullanılarak bulutta derlenmiştir."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}